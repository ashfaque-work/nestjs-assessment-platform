name: Live demo check

# Signs in to the live demo as the demo student and teacher and walks through the app in a real
# browser: takes a test, reviews it, checks the answer key never reaches the student, and reads
# the teacher's class results. Runs daily after the demo data is reset, and on demand.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://assess.ashfaqueahmad.com

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the checks
        run: npx playwright test
        env:
          CI: 'true'
          BASE_URL: ${{ inputs.base_url || 'https://assess.ashfaqueahmad.com' }}

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
