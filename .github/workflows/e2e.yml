name: Live demo check

# Signs in to the live demo as the demo student and teacher and walks through the app in a real
# browser: takes a test, reviews it, checks the answer key never reaches the student, and reads
# the teacher's class results. Runs daily after the demo data is reset, and on demand.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://assess.ashfaqueahmad.com

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The demo runs on a free plan that stops the container after fifteen
      # minutes idle, and this job is scheduled, so it almost always arrives to
      # a cold one. Playwright would then spend its timeouts waiting for a
      # server that is still booting and report the suite as broken — which is
      # what it did nightly. Wake it first, and only then start the clock.
      - name: Wake the demo
        env:
          BASE_URL: ${{ inputs.base_url || 'https://assess.ashfaqueahmad.com' }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$BASE_URL/login" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "The demo did not answer in time; running the checks anyway."

      - name: Run the checks
        run: npx playwright test
        env:
          CI: 'true'
          BASE_URL: ${{ inputs.base_url || 'https://assess.ashfaqueahmad.com' }}

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
